<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>CSS練習</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>

  <h1 class="pageTitle">CSS練習</h1>

  <section>
    <h2>段落</h2>
    <p>テスト</p>
    <p id="highlight">テスト</p>
  </section>

  <section>
    <h2>リスト</h2>
    <ul>
      <li>りんご</li>
      <li>みかん</li>
      <li>ぶどう</li>
    </ul>
    <ol>
      <li>朝食</li>
      <li>昼食</li>
      <li>夕食</li>
    </ol>
  </section>

  <section>
    <h2>表</h2>
    <table border="1">
      <caption>成績表</caption>
      <thead>
        <tr><th>科目</th><th>点数</th></tr>
      </thead>
      <tbody>
        <tr><th>数学</th><td>85</td></tr>
        <tr><th>英語</th><td>92</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>リンク</h2>
    <p><a href="https://www.kindai.ac.jp/" target="_blank">近畿大学</a></p>
  </section>

  <footer>
    <p>&copy; 2026</p>
  </footer>

</body>
</html>
