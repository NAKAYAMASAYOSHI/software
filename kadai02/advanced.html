<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>CSS練習（Bootstrap版）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CSS練習</a>
    </div>
  </nav>

  <div class="container my-5">

    <h1 class="text-center mb-5">CSS練習</h1>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="card-title h4">段落</h2>
        <p class="card-text">テスト</p>
        <p class="card-text"><span class="badge text-bg-danger">テスト</span></p>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="card-title h4">リスト</h2>
        <ul class="list-group list-group-flush mb-3">
          <li class="list-group-item">りんご</li>
          <li class="list-group-item">みかん</li>
          <li class="list-group-item">ぶどう</li>
        </ul>
        <ol class="list-group list-group-numbered">
          <li class="list-group-item">朝食</li>
          <li class="list-group-item">昼食</li>
          <li class="list-group-item">夕食</li>
        </ol>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="card-title h4">表</h2>
        <table class="table table-striped table-bordered">
          <caption>成績表</caption>
          <thead class="table-dark">
            <tr><th>科目</th><th>点数</th></tr>
          </thead>
          <tbody>
            <tr><th>数学</th><td>85</td></tr>
            <tr><th>英語</th><td>92</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="card-title h4">リンク</h2>
        <a href="https://www.kindai.ac.jp/" target="_blank" class="btn btn-outline-primary">近畿大学</a>
      </div>
    </div>

  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
